name: Validate skills

on:
  push:
    branches:
      - main
      - "agent/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pinned validation tools
        run: python -m pip install ruff==0.15.20 pytest==9.0.3

      - name: Lint Python
        run: ruff check --no-cache skills evals scripts

      - name: Check public-tree privacy
        run: python scripts/check_public_privacy.py

      - name: Run public-tree privacy tests
        run: >-
          python -m unittest discover
          -s scripts
          -p 'test_*.py'

      - name: Rebuild deterministic Zotero bridge asset
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          task_root="$(mktemp -d)"
          trap 'rm -rf -- "$task_root"' EXIT
          python skills/zotero-declarative-bridge/scripts/build_xpi.py \
            "$task_root/zotero-declarative-bridge-0.1.11.xpi"
          cmp -- \
            dist/zotero-declarative-bridge-0.1.11.xpi \
            "$task_root/zotero-declarative-bridge-0.1.11.xpi"

      - name: Run curation helper tests
        run: >-
          python -m unittest discover
          -s skills/curate-research-to-zotero/scripts
          -p 'test_*.py'

      - name: Run research-ledger tests
        run: >-
          python -m unittest discover
          -s skills/deep-research/scripts
          -p 'test_*.py'

      - name: Run research workflow retrospective tests
        run: >-
          python -m unittest discover
          -s skills/research-workflow-retrospective/scripts
          -p 'test_*.py'

      - name: Run knowledge-network tests
        run: >-
          python -m unittest discover
          -s skills/research-knowledge-network/scripts
          -p 'test_*.py'

      - name: Run learn-from-papers tests
        run: >-
          python -m unittest discover
          -s skills/learn-from-papers/scripts
          -p 'test_*.py'

      - name: Run evidence-appraisal tests
        run: >-
          python -m pytest -q
          skills/evidence-appraisal/scripts/test_evidence_appraisal_seam.py
          skills/evidence-appraisal/tests/test_contract_adversarial.py

      - name: Run evidence-appraisal quick validation
        run: python skills/evidence-appraisal/scripts/quick_validate.py

      - name: Run learn-from-papers quality evaluations
        run: >-
          python -m unittest discover
          -s evals/learn-from-papers
          -p 'test_*.py'

      - name: Run scholar-discovery tests
        run: >-
          python -m unittest discover
          -s skills/scholar-discovery/scripts
          -p 'test_*.py'

      - name: Run network-gap-discovery tests
        run: >-
          python -m unittest discover
          -s skills/network-gap-discovery/scripts
          -p 'test_*.py'

      - name: Run scholarly-source-acquisition tests
        run: >-
          python -m unittest discover
          -s skills/scholarly-source-acquisition/scripts
          -p 'test_*.py'

      - name: Run scholarly-document-normalization tests
        run: >-
          python -m unittest discover
          -s skills/scholarly-document-normalization/scripts
          -p 'test_*.py'

      - name: Run research-network-publish tests
        run: >-
          python -m unittest discover
          -s skills/research-network-publish/scripts
          -p 'test_*.py'

      - name: Run Zotero declarative bridge Python tests
        run: >-
          python -m unittest discover
          -s skills/zotero-declarative-bridge/scripts
          -p 'test_*.py'

      - name: Run Zotero declarative bridge JavaScript tests
        run: >-
          node --test
          skills/zotero-declarative-bridge/scripts/test_*core.js
          skills/zotero-declarative-bridge/scripts/test_metadata_repair_bootstrap_vm.js

      - name: Run Zotero metadata repair tests
        run: >-
          python -m unittest discover
          -s skills/repair-zotero-metadata/scripts
          -p 'test_*.py'

      - name: Run six-skill workflow routing evaluations
        run: >-
          python -m unittest discover
          -s evals/research-workflow
          -p 'test_*.py'

      - name: Run reproducibility-harness tests
        run: >-
          python -m unittest discover
          -s evals/real-world
          -p 'test_*.py'

      - name: Compile Python
        run: python -m compileall -q skills evals scripts

      - name: Check skill package layout
        shell: bash
        run: |
          set -euo pipefail
          for skill in \
            skills/deep-research \
            skills/learn-from-papers \
            skills/evidence-appraisal \
            skills/research-knowledge-network \
            skills/research-workflow-retrospective \
            skills/scholar-discovery \
            skills/network-gap-discovery \
            skills/curate-research-to-zotero \
            skills/scholarly-source-acquisition \
            skills/scholarly-document-normalization \
            skills/research-network-publish \
            skills/zotero-declarative-bridge \
            skills/repair-zotero-metadata
          do
            test -s "$skill/SKILL.md"
            test -s "$skill/agents/openai.yaml"
          done

      - name: Rehearse immutable tagged-skill installation
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          task_root="$(mktemp -d)"
          trap 'rm -rf -- "$task_root"' EXIT

          git clone --quiet --depth 1 --branch "$GITHUB_REF_NAME" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$task_root/tagged"

          mkdir -p -- \
            "$task_root/bin" \
            "$task_root/codex/skills/unrelated-skill"
          printf 'unrelated\n' > \
            "$task_root/codex/skills/unrelated-skill/SKILL.md"
          cat > "$task_root/bin/codex" <<'PY'
          #!/usr/bin/env python3
          import json
          import os
          import pathlib
          import sys

          if sys.argv[1:3] == ["debug", "prompt-input"]:
              root = pathlib.Path(os.environ["CODEX_HOME"]) / "skills"
              locators = sorted(root.glob("*/SKILL.md"))
              locators_text = "\n".join(f"(file: {path})" for path in locators)
              print(
                  json.dumps(
                      [
                          {
                              "content": [
                                  {"type": "input_text", "text": locators_text}
                              ]
                          }
                      ]
                  )
              )
          elif sys.argv[1:] == ["doctor", "--json"]:
              print(
                  json.dumps(
                      {
                          "schemaVersion": 1,
                          "overallStatus": "ok",
                          "checks": {
                              "loader-verify": {
                                  "id": "loader-verify",
                                  "status": "ok",
                              }
                            },
                      }
                  )
              )
          else:
              raise SystemExit(2)
          PY
          chmod 0700 "$task_root/bin/codex"

          PATH="$task_root/bin:$PATH" \
            python "$task_root/tagged/scripts/install_tagged_skills.py" \
              --tag "$GITHUB_REF_NAME" \
              --repo "$task_root/tagged" \
              --skills-root "$task_root/codex/skills" \
              --backup-root "$task_root/codex/skill-backups" \
              > "$task_root/install-result.json"

          test -s "$task_root/codex/skills/unrelated-skill/SKILL.md"
          python - "$task_root/install-result.json" <<'PY'
          import json
          import hashlib
          import pathlib
          import stat
          import sys

          result = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          backup = pathlib.Path(result["backup_root"])
          assert stat.S_IMODE(backup.stat().st_mode) == 0o700
          assert (backup / "skills-before-install").is_dir()
          assert (backup / "source-manifest.json").read_bytes() == (
              backup / "installed-manifest.json"
          ).read_bytes()
          loaders = json.loads(
              (backup / "codex-loaders.json").read_text(encoding="utf-8")
          )
          assert set(loaders) == {"loader", "doctor"}
          assert set(loaders["loader"]) == {
            "status",
            "skill_count",
            "skill_names",
            "locator_set_sha256",
          }
          assert loaders["loader"]["status"] == "ok"
          assert loaders["loader"]["skill_count"] == 12
          expected_skill_names = [
              "curate-research-to-zotero",
              "deep-research",
              "evidence-appraisal",
              "learn-from-papers",
              "network-gap-discovery",
              "repair-zotero-metadata",
              "research-knowledge-network",
              "research-network-publish",
              "research-workflow-retrospective",
              "scholar-discovery",
              "scholarly-document-normalization",
              "scholarly-source-acquisition",
          ]
          assert loaders["loader"]["skill_names"] == expected_skill_names
          installed_skills_root = backup.parent.parent / "skills"
          expected_locators = sorted(
              str(installed_skills_root / name / "SKILL.md")
              for name in loaders["loader"]["skill_names"]
          )
          expected_locator_sha = hashlib.sha256(
              json.dumps(expected_locators, separators=(",", ":")).encode("utf-8")
          ).hexdigest()
          assert loaders["loader"]["locator_set_sha256"] == expected_locator_sha
          assert set(loaders["doctor"]) == {
            "schemaVersion",
            "overallStatus",
            "status_counts",
            "check_count",
            "check_ids_sha256",
          }
          assert loaders["doctor"]["schemaVersion"] == 1
          assert loaders["doctor"]["overallStatus"] == "ok"
          assert loaders["doctor"]["status_counts"] == {"ok": 1}
          assert loaders["doctor"]["check_count"] == 1
          expected_check_sha = hashlib.sha256(
              json.dumps(["loader-verify"], separators=(",", ":")).encode("utf-8")
          ).hexdigest()
          assert loaders["doctor"]["check_ids_sha256"] == expected_check_sha
          assert not (backup / "prompt-debug-raw.json").exists()
          assert not (backup / "doctor-raw.json").exists()
          PY
