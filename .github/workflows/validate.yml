name: Validate skills

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pinned lint tool
        run: python -m pip install ruff==0.15.20

      - name: Lint Python
        run: ruff check --no-cache skills evals scripts

      - name: Check public-tree privacy
        run: python scripts/check_public_privacy.py

      - name: Run public-tree privacy tests
        run: >-
          python -m unittest discover
          -s scripts
          -p 'test_*.py'

      - name: Run curation helper tests
        run: >-
          python -m unittest discover
          -s skills/curate-research-to-zotero/scripts
          -p 'test_*.py'

      - name: Run research-ledger tests
        run: >-
          python -m unittest discover
          -s skills/deep-research/scripts
          -p 'test_*.py'

      - name: Run knowledge-network tests
        run: >-
          python -m unittest discover
          -s skills/research-knowledge-network/scripts
          -p 'test_*.py'

      - name: Run learn-from-papers tests
        run: >-
          python -m unittest discover
          -s skills/learn-from-papers/scripts
          -p 'test_*.py'

      - name: Run learn-from-papers quality evaluations
        run: >-
          python -m unittest discover
          -s evals/learn-from-papers
          -p 'test_*.py'

      - name: Run scholar-discovery tests
        run: >-
          python -m unittest discover
          -s skills/scholar-discovery/scripts
          -p 'test_*.py'

      - name: Run network-gap-discovery tests
        run: >-
          python -m unittest discover
          -s skills/network-gap-discovery/scripts
          -p 'test_*.py'

      - name: Run scholarly-source-acquisition tests
        run: >-
          python -m unittest discover
          -s skills/scholarly-source-acquisition/scripts
          -p 'test_*.py'

      - name: Run scholarly-document-normalization tests
        run: >-
          python -m unittest discover
          -s skills/scholarly-document-normalization/scripts
          -p 'test_*.py'

      - name: Run research-network-publish tests
        run: >-
          python -m unittest discover
          -s skills/research-network-publish/scripts
          -p 'test_*.py'

      - name: Run Zotero declarative bridge Python tests
        run: >-
          python -m unittest discover
          -s skills/zotero-declarative-bridge/scripts
          -p 'test_*.py'

      - name: Run Zotero declarative bridge JavaScript tests
        run: node --test skills/zotero-declarative-bridge/scripts/test_bridge_core.js

      - name: Run six-skill workflow routing evaluations
        run: >-
          python -m unittest discover
          -s evals/research-workflow
          -p 'test_*.py'

      - name: Run reproducibility-harness tests
        run: >-
          python -m unittest discover
          -s evals/real-world
          -p 'test_*.py'

      - name: Compile Python
        run: python -m compileall -q skills evals scripts

      - name: Check skill package layout
        shell: bash
        run: |
          set -euo pipefail
          for skill in \
            skills/deep-research \
            skills/learn-from-papers \
            skills/research-knowledge-network \
            skills/scholar-discovery \
            skills/network-gap-discovery \
            skills/curate-research-to-zotero \
            skills/scholarly-source-acquisition \
            skills/scholarly-document-normalization \
            skills/research-network-publish \
            skills/zotero-declarative-bridge
          do
            test -s "$skill/SKILL.md"
            test -s "$skill/agents/openai.yaml"
          done
